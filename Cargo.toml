[package]
name = "file-craft"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"
libc = "0.2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2

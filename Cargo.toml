[package]
name = "dolphincraft"
version = "0.1.2"
edition = "2021"
description = "DolphinCraft — a desktop file manager in Rust and egui, rebuilt from Dolphin with extra tools."
authors = ["Michael Bayes"]
license = "MIT"
repository = "https://github.com/mjb73/DolphinCraft"
homepage = "https://github.com/mjb73/DolphinCraft"
readme = "README.md"
keywords = ["file-manager", "files", "egui", "dolphin", "desktop"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"
libc = "0.2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
